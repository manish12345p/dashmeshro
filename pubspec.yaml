name: dashmeshro
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  customer_directory:
    path: packages/customer_directory
  router:
    path: packages/router
  core:
    path: packages/core
  core_ui:
    path: packages/core_ui
  google_fonts: ^8.0.2
  crystal_navigation_bar: ^1.1.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_cli: ^0.28.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
